# XcodeGen spec. Run `xcodegen` in this folder to regenerate PawDone.xcodeproj.
name: PawDone

options:
  bundleIdPrefix: com.abhaysingh
  deploymentTarget:
    iOS: "17.0"

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
    SWIFT_APPROACHABLE_CONCURRENCY: YES
    MARKETING_VERSION: 1.0.0
    CURRENT_PROJECT_VERSION: 2
    DEVELOPMENT_TEAM: LS942W7YC2
    CODE_SIGN_STYLE: Automatic

packages:
  Supabase:
    url: https://github.com/supabase/supabase-swift
    from: 2.0.0
  GoogleSignIn:
    url: https://github.com/google/GoogleSignIn-iOS
    from: 10.0.0
  RevenueCat:
    url: https://github.com/RevenueCat/purchases-ios-spm
    from: 5.95.0

targets:
  PawDone:
    type: application
    platform: iOS
    sources:
      - path: PawDone
        type: syncedFolder
    configFiles:
      Debug: Config/App.xcconfig
      Release: Config/App.xcconfig
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.abhaysingh.pawdone
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
    info:
      path: Support/Info.plist
      properties:
        CFBundleDisplayName: PawDone
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        ITSAppUsesNonExemptEncryption: false
        NSCameraUsageDescription: PawDone uses the camera to take photo proof that your pet's care was done.
        SUPABASE_HOST: $(SUPABASE_HOST)
        SUPABASE_ANON_KEY: $(SUPABASE_ANON_KEY)
        REVENUECAT_API_KEY: $(REVENUECAT_API_KEY)
        REVENUECAT_APP_STORE_KEY: $(REVENUECAT_APP_STORE_KEY)
        GIDClientID: $(GOOGLE_IOS_CLIENT_ID)
        GIDServerClientID: $(GOOGLE_WEB_CLIENT_ID)
        CFBundleURLTypes:
          - CFBundleURLName: Google sign-in
            CFBundleURLSchemes: [$(GOOGLE_REVERSED_CLIENT_ID)]
    entitlements:
      path: Support/PawDone.entitlements
      properties:
        com.apple.developer.applesignin: [Default]
        aps-environment: development
    dependencies:
      - package: Supabase
      - package: GoogleSignIn
        product: GoogleSignIn
      - package: GoogleSignIn
        product: GoogleSignInSwift
      - package: RevenueCat
        product: RevenueCat
    scheme:
      testTargets: [PawDoneTests]

  PawDoneTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: PawDoneTests
        type: syncedFolder
    dependencies:
      - target: PawDone
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.abhaysingh.pawdone.tests
        GENERATE_INFOPLIST_FILE: YES
