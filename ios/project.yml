# XcodeGen spec. Run `xcodegen` in this folder to regenerate PawDone.xcodeproj.
name: PawDone

options:
  bundleIdPrefix: com.abhaysingh
  deploymentTarget:
    iOS: "17.0"

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
    SWIFT_APPROACHABLE_CONCURRENCY: YES
    MARKETING_VERSION: 0.1.0
    CURRENT_PROJECT_VERSION: 1

packages:
  Supabase:
    url: https://github.com/supabase/supabase-swift
    from: 2.0.0

targets:
  PawDone:
    type: application
    platform: iOS
    sources:
      - path: PawDone
        type: syncedFolder
    configFiles:
      Debug: Config/App.xcconfig
      Release: Config/App.xcconfig
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.abhaysingh.pawdone
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
    info:
      path: Support/Info.plist
      properties:
        CFBundleDisplayName: PawDone
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        ITSAppUsesNonExemptEncryption: false
        SUPABASE_HOST: $(SUPABASE_HOST)
        SUPABASE_ANON_KEY: $(SUPABASE_ANON_KEY)
    entitlements:
      path: Support/PawDone.entitlements
      properties:
        com.apple.developer.applesignin: [Default]
    dependencies:
      - package: Supabase
    scheme:
      testTargets: [PawDoneTests]

  PawDoneTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: PawDoneTests
        type: syncedFolder
    dependencies:
      - target: PawDone
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.abhaysingh.pawdone.tests
        GENERATE_INFOPLIST_FILE: YES
